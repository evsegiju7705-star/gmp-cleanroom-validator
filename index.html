<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Протоколы аттестации чистых помещений</title>
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/protocol.css">
</head>
<body>
<div id="app">
  <header class="top">
    <h1>Протоколы аттестации чистых помещений</h1>
    <div class="top-actions">
      <span id="save-state" role="status"></span>
      <button type="button" id="btn-export">Сохранить в файл</button>
      <button type="button" id="btn-import">Загрузить из файла</button>
      <input type="file" id="file-import" accept=".json,application/json" hidden>
      <button type="button" id="btn-reset" class="danger">Очистить всё</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button type="button" data-tab="general">Общие данные</button>
    <button type="button" data-tab="instruments">Приборы</button>
    <button type="button" data-tab="rooms">Помещения</button>
    <button type="button" data-tab="skch">Концентрация частиц</button>
  </nav>
  <main id="view"></main>
</div>
<div id="preview" hidden>
  <div class="preview-bar">
    <button type="button" id="btn-print" class="primary">Печать / сохранить в PDF</button>
    <button type="button" id="btn-close-preview">Закрыть</button>
  </div>
  <div id="print"></div>
</div>
<script src="js/ref.js"></script>
<script src="js/calc.js"></script>
<script src="js/store.js"></script>
<script src="js/protocol-skch.js"></script>
<script src="js/app.js"></script>
</body>
</html>
